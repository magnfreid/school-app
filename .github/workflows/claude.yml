name: Claude

# Mention-triggered only. Nothing runs unless a human writes "@claude" in a
# comment, so this never fires automatically on every PR.
#
# Reviewing before a PR exists is the better loop and belongs in the editor:
# run /dev-workflow:feature (which reviews as part of shipping) or /code-review
# locally. This workflow is for pulling Claude into a conversation that is
# already happening on GitHub.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Cheap pre-filter: skip the runner entirely unless "@claude" is present.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # CLAUDE.md is picked up from the checkout, so Claude reviews against
          # this project's conventions without them being restated here.
